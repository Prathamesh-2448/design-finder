<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Finder</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --muted: #6b6860; --line: #e2dfd8;
    --accent: #1f5f4a; --accent-ink: #ffffff; --warn-bg: #fff4e0; --warn-ink: #7a4b00;
    --ok-bg: #e6f3ed; --ok-ink: #14503b; --err-bg: #fde8e6; --err-ink: #8a1f14;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --card: #201f1c; --ink: #f1efe9; --muted: #a09c92; --line: #343230;
      --accent: #4fb28f; --accent-ink: #0b1a14; --warn-bg: #3a2c10; --warn-ink: #f2cf8a;
      --ok-bg: #16342a; --ok-ink: #9be0c3; --err-bg: #3d1b17; --err-ink: #f3a79e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  #drop { background: var(--card); border: 2px dashed var(--line); border-radius: 14px;
          padding: 28px 16px; text-align: center; transition: border-color .15s; }
  #drop.over { border-color: var(--accent); }
  #drop p { margin: 0 0 14px; color: var(--muted); }
  .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
                 font: inherit; padding: 12px 18px; border-radius: 10px; cursor: pointer; min-height: 48px; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  input[type=file] { display: none; }
  #preview { max-width: 100%; max-height: 220px; border-radius: 10px; margin: 0 auto 14px; display: none; }

  #status { margin: 20px 0 0; }
  .banner { border-radius: 12px; padding: 12px 14px; font-weight: 500; }
  .banner.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .banner.err { background: var(--err-bg); color: var(--err-ink); }
  .banner.busy { background: var(--card); border: 1px solid var(--line); color: var(--muted); }

  #results { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
  .match { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
           display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; }
  .match.first { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .match img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; background: var(--line); cursor: zoom-in; }
  .num { font-size: 1.5rem; font-weight: 700; letter-spacing: .01em; word-break: break-all; }
  .rank { color: var(--muted); font-size: .85rem; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .score { color: var(--muted); font-size: .85rem; }
  .copy { margin-top: 8px; padding: 6px 12px; min-height: 0; font-size: .9rem; }
  .confirm { margin-left: 6px; }
  .confirm:disabled { opacity: .5; cursor: default; }
  #fb { margin-top: 14px; }
  #fb .banner button { margin-left: 10px; padding: 4px 12px; min-height: 0; font-size: .9rem; }
  #manual { display: none; margin-top: 16px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  #manual p { margin: 0 0 10px; color: var(--muted); font-size: .95rem; }
  #manual .row { display: flex; gap: 8px; }
  #manual input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--ink); }

  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center;
          justify-content: center; padding: 16px; z-index: 10; }
  #zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  @media (max-width: 420px) { .match { grid-template-columns: 96px 1fr; } .match img { width: 96px; height: 96px; } }
</style>
</head>
<body>
<main>
  <h1>Design Finder</h1>
  <p class="sub">Upload the customer's photo to get the design number.</p>

  <div id="drop">
    <img id="preview" alt="Selected photo">
    <p id="hint">Drop a photo here, paste one (Ctrl+V), or choose below.</p>
    <div class="buttons">
      <button class="primary" id="pick" type="button">Choose photo</button>
      <button id="snap" type="button">Take photo</button>
    </div>
    <input id="file" type="file" accept="image/*">
    <input id="camera" type="file" accept="image/*" capture="environment">
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <ol id="results"></ol>
  <div id="manual">
    <p>Not the right design? Type the correct number and save it, so the next photo like this is found.</p>
    <div class="row">
      <input id="manualNo" type="text" placeholder="Design number, e.g. D1042" autocomplete="off">
      <button id="manualSave" class="confirm" type="button" data-label="Save">Save</button>
    </div>
  </div>
  <div id="fb" role="status" aria-live="polite"></div>
</main>

<div id="zoom"><img alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const drop = $("drop"), preview = $("preview"), statusEl = $("status"), results = $("results");
let counter = 0;  // ignore a slow response if a newer search has started
let lastFile = null;   // the photo being searched, re-sent if the manager confirms a design
let saved = null;      // {design, id} once the manager has confirmed one for this photo

$("pick").onclick = () => $("file").click();
$("snap").onclick = () => $("camera").click();
$("file").onchange = $("camera").onchange = (e) => { if (e.target.files[0]) search(e.target.files[0]); e.target.value = ""; };

["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) search(f); });
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) search(item.getAsFile());
});

function say(kind, text) { statusEl.innerHTML = `<div class="banner ${kind}"></div>`; statusEl.firstChild.textContent = text; }

async function search(file) {
  const mine = ++counter;
  lastFile = file; saved = null;
  results.innerHTML = ""; $("fb").innerHTML = ""; $("manual").style.display = "none"; $("manualNo").value = "";
  preview.src = URL.createObjectURL(file); preview.style.display = "block"; $("hint").style.display = "none";
  say("busy", "Searching the catalog…");
  try {
    const form = new FormData(); form.append("photo", file, file.name || "photo.jpg");
    const res = await fetch("/search", { method: "POST", body: form });
    if (mine !== counter) return;
    if (!res.ok) {
      let detail = "Something went wrong."; try { detail = (await res.json()).detail || detail; } catch {}
      return say("err", detail);
    }
    show(await res.json());
  } catch (err) {
    if (mine === counter) say("err", "Could not reach the server. Check the connection and try again.");
  }
}

function show(data) {
  const best = data.matches[0];
  if (data.confident) say("ok", `Best match: ${best.design_number}. Compare with the photo to be sure.`);
  else say("warn", "No confident match. This may be a new design. Closest ones are listed below.");

  results.innerHTML = "";
  data.matches.forEach((m, i) => {
    const li = document.createElement("li"); li.className = "match" + (i === 0 && data.confident ? " first" : "");
    const pct = Math.max(0, Math.min(100, Math.round((m.score - 0.2) / 0.8 * 100)));
    li.innerHTML = `<img alt=""><div><div class="rank"></div><div class="num"></div>
      <div class="bar"><span></span></div><div class="score"></div><button class="copy" type="button">Copy number</button><button class="copy confirm" type="button" data-label="This is it">This is it</button></div>`;
    const img = li.querySelector("img"); img.src = m.thumb; img.alt = "Design " + m.design_number;
    img.onclick = () => { $("zoom").firstElementChild.src = m.image; $("zoom").style.display = "flex"; };
    li.querySelector(".rank").textContent = i === 0 ? "Closest" : "#" + (i + 1);
    li.querySelector(".num").textContent = m.design_number;
    li.querySelector(".bar span").style.width = pct + "%";
    li.querySelector(".score").textContent = "Similarity " + m.score.toFixed(2);
    const btn = li.querySelector(".copy");
    btn.onclick = async () => { try { await navigator.clipboard.writeText(m.design_number); btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy number", 1200); } catch {} };
    const yes = li.querySelector(".confirm"); yes.onclick = () => sendFeedback(m.design_number, yes);
    results.appendChild(li);
  });
  $("manual").style.display = "block";
}

// ---- "this was the right one": save the photo against the confirmed design number
function fb(kind, text, undo) {
  const box = $("fb"); box.innerHTML = `<div class="banner ${kind}"><span></span></div>`;
  box.querySelector("span").textContent = text;
  if (undo) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Undo"; b.onclick = undo; box.firstChild.appendChild(b); }
}
function setConfirmButtons(disabled) {
  document.querySelectorAll(".confirm").forEach(b => { b.disabled = disabled; b.textContent = b.dataset.label; });
  $("manualNo").disabled = disabled;
}

async function sendFeedback(design, btn) {
  if (!lastFile || saved) return;
  if (!design) return fb("warn", "Type a design number first.");
  setConfirmButtons(true); btn.textContent = "Saving…";
  try {
    const form = new FormData();
    form.append("photo", lastFile, lastFile.name || "photo.jpg"); form.append("design_number", design);
    const res = await fetch("/feedback", { method: "POST", body: form });
    if (!res.ok) {
      let detail = "Could not save that."; try { detail = (await res.json()).detail || detail; } catch {}
      setConfirmButtons(false); return fb("err", detail);
    }
    const r = await res.json();
    saved = { design, id: r.id };
    btn.textContent = "Saved ✓";
    fb("ok", `Saved. This photo will now help find ${design}.`, () => undo(saved));
  } catch {
    setConfirmButtons(false); fb("err", "Could not reach the server. Nothing was saved.");
  }
}

async function undo(s) {
  try {
    const res = await fetch(`/feedback/${encodeURIComponent(s.design)}/${s.id}`, { method: "DELETE" });
    if (!res.ok) return fb("err", "Could not undo. Try again.");
    saved = null; setConfirmButtons(false); $("fb").innerHTML = "";
  } catch { fb("err", "Could not reach the server."); }
}
$("manualSave").onclick = () => sendFeedback($("manualNo").value.trim(), $("manualSave"));
$("manualNo").addEventListener("keydown", e => { if (e.key === "Enter") $("manualSave").click(); });

$("zoom").onclick = () => { $("zoom").style.display = "none"; };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("zoom").style.display = "none"; });
</script>
</body>
</html>
